<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101e28"><title>迷宮尋詩 · 月下藏書庭</title><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"></head><body><main>
<header><a href="./" class="brand"><span class="brand-symbol">✧</span><span>迷宮尋詩<small>THE MOONLIT ARCHIVE</small></span></a><div class="toolbar"><button id="sound">音效：關</button><button id="pause" disabled>暫停</button></div></header>
<section class="stage" aria-label="迷宮尋詩遊戲"><canvas id="scene" tabindex="0" aria-label="俯視迷宮，使用方向鍵移動"></canvas><div class="hud"><div class="map-wrap"><span class="eyebrow">月下藏書庭</span><canvas id="minimap" width="210" height="170" aria-label="完整迷宮地圖：金點為玩家，門框為出口"></canvas><small>● 你的位置　◇ 出口</small></div><div class="stats"><small id="round">等待探索</small><b id="timer">00:00.0</b><span><strong id="score">0</strong> 分</span><small id="gate-status">收齊文字，開啟出口</small></div></div>
<div id="feedback" role="status" aria-live="polite"></div><div class="bottom-hud"><span class="eyebrow">本局目標詩句</span><div id="sentence">拾起散落的文字，找到詩的歸途。</div><small id="progress">不限順序收集 · 沒有倒數限制</small></div><div id="nearby"></div>
<div id="overlay"><div class="panel"><span class="eyebrow" id="panel-tag">在月光裡，找回一首詩</span><h1 id="panel-title">每個轉角，<br>藏著一個字。</h1><div id="panel-content"><p>漫步古老藏書庭，尋找目標詩句的文字。<br>收齊全句後，沿迷宮走向亮起的出口。</p><div class="rules"><span><b>＋20</b> 收集目標字</span><span><b>－10</b> 誤收混淆字</span><span><b>3 次</b> 位置提示</span></div><label>挑戰局數<select id="round-count"><option value="1">1 局 · 月下漫步</option><option value="2">2 局 · 深入探尋</option><option value="3">3 局 · 完整旅程</option></select></label></div><button class="primary" id="action">進入藏書庭 →</button><small id="panel-note">WASD／方向鍵 移動 · 空白鍵 收集 · V 提示 · P 暫停</small></div></div></section>
<section class="controls" aria-label="遊戲控制"><div class="joystick" id="joystick" aria-label="虛擬搖桿"><div id="stick"></div><span>移動</span></div><div class="instructions">收集順序不限，重複字分別尋找。<small>靠近字牌，再按空白鍵或「收集」。</small></div><div class="actions"><button id="hint" disabled><span>✧</span> 提示 <small id="hint-count">3／3 · V</small></button><button id="collect" disabled><span>＋</span> 收集 <small>空白鍵</small></button></div></section><footer>探索 · 記憶 · 尋詩 <span>隨機迷宮 ／ 無敵人 ／ 無倒數</span></footer></main><script src="words.js"></script><script src="model.js"></script><script src="game.js"></script></body></html>
